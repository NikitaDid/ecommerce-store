{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="product-container" style="max-width: 600px; margin: 40px auto; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

    <!-- Product Image -->
    {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}" style="width: 100%; max-width: 400px; margin-bottom: 20px; border-radius: 12px;">
    {% else %}
        <img src="{% static 'img/no-image.png' %}" style="width: 100%; max-width: 400px; margin-bottom: 20px; border-radius: 12px;">
    {% endif %}

    <!-- Product Name -->
    <h1 style="font-weight: 600; font-size: 2rem; margin-bottom: 10px;">{{ product.name }}</h1>

    <!-- Product Description -->
    <p style="color: #555; font-size: 1rem; margin-bottom: 30px;">{{ product.description }}</p>

    <!-- Add to Cart Button -->
    <a href="#" style="display: inline-block; background-color: #0071e3; color: white; padding: 12px 30px; border-radius: 8px; text-decoration: none; font-weight: 500;">Add to Cart</a>

</div>
{% endblock %}
