{% extends 'base.html' %}

{% block content %}
<div class="card" style="width: 18rem;">
    <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
    <h2>{{ product.name }}</h2>
    <div class="card-body">
        <p class="card-text">{{ product.description }}</p>
        <a href="#" class="btn btn-primary">Add to cart</a>
    </div>
</div>
{% endblock %}
