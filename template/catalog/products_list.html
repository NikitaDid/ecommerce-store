<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends "base.html" %}

{% block title %}{{ category.name }} Products{% endblock %}

{% block content %}
<h2>{{ category.name }}</h2>

<ul>
    {% for product in products %}
        <a href="{% url 'catalog:product_detail' category.slug product.id %}">{{product.name}}</a>
    {% empty %}
        <li>Нет товаров в этой категории.</li>
    {% endfor %}
</ul>

<a href="{% url 'catalog:category_list' %}">Back to catalog</a>
{% endblock %}
</body>
</html>
