{% extends "base.html" %}
{% load static %}

{% block content %}
<div style="max-width: 380px; margin: 60px auto; padding: 40px; background: white;
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

    <h1 style="font-size: 1.8rem; margin-bottom: 25px; text-align: center;
               font-weight: 600; color: #1d1d1f;">
        Sign In
    </h1>
    {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
    {% endif %}
    <form method="POST" action="">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Apple ID" required
               style="width: 100%; padding: 14px; margin-bottom: 15px;
               border: 1px solid #d2d2d7; border-radius: 12px; font-size: 1rem;
               outline: none; transition: 0.2s;">
        
        <input type="password" name="password" placeholder="Password" required
               style="width: 100%; padding: 14px; margin-bottom: 15px;
               border: 1px solid #d2d2d7; border-radius: 12px; font-size: 1rem;
               outline: none; transition: 0.2s;">

        <button type="submit"
                style="width: 100%; padding: 14px; background-color: #0071e3; color: white;
                       border: none; border-radius: 12px; font-size: 1rem; font-weight: 500;
                       cursor: pointer; transition: 0.2s; margin-top: 10px;">
            Sign In
        </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
        <a href="#" style="color: #0071e3; text-decoration: none;">
            Forgot Apple ID or password?
        </a>
    </div>
</div>
{% endblock %}
